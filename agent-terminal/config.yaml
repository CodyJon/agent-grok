---
name: "Grok Terminal"
description: "Web terminal with xAI Grok Build CLI and persistent auth"
version: "1.2.1"
slug: "grok_terminal"
init: false

image: "ghcr.io/codyjon/{arch}-addon-grok-terminal"

arch:
  - aarch64
  - amd64

url: "https://github.com/CodyJon/agent-grok"

ingress: true
ingress_port: 7681
panel_icon: mdi:star-four-points
panel_title: "Grok Terminal"
panel_admin: true

ports:
  7681/tcp: null
ports_description:
  7681/tcp: "Direct web terminal. Not needed for ingress, and NOT password-protected: anyone who can reach this port gets a root shell in the container, with no Home Assistant login. Leave unset unless the port is firewalled."

options:
  auto_launch_grok: true
  grok_auto_update: true
  working_directory: ""
  xai_api_key: ""
  always_approve: false
  grok_extra_args: ""
  ha_smart_context: true
  enable_ha_mcp: true
  ha_mcp_version: "7.11.0"
  persistent_apk_packages: []
  persistent_pip_packages: []
schema:
  auto_launch_grok: bool?
  grok_auto_update: bool?
  working_directory: str?
  xai_api_key: password?
  always_approve: bool?
  grok_extra_args: str?
  ha_smart_context: bool?
  enable_ha_mcp: bool?
  ha_mcp_version: str?
  persistent_apk_packages:
    - str
  persistent_pip_packages:
    - str

map:
  - config:rw
  - all_addon_configs:rw
  - share:rw

hassio_api: true
hassio_role: manager
homeassistant_api: true

startup: services

webui: http://[HOST]:[PORT:7681]/
